<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수강신청 설문조사 - 로그인</title>
    <link rel="stylesheet" href="/public/css/main.css">
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>수강신청 설문조사</h1>
            <p>다음 학기 수강 계획을 입력해주세요</p>
        </div>

        <form id="loginForm" class="login-form" action="/login" method="POST">
            <div class="form-group">
                <label for="studentId">학번 *</label>
                <input type="text" id="studentId" name="student_id" required
                       placeholder="예: 2021123456">
            </div>

            <div class="form-group">
                <label for="name">성함 *</label>
                <input type="text" id="name" name="name" required
                       placeholder="예: 홍길동">
            </div>

            <div class="form-group">
                <label for="password">비밀번호 *</label>
                <input type="password" id="password" name="password" required
                       placeholder="비밀번호 입력">
                <small>최초 로그인 시 입력한 비밀번호가 저장됩니다</small>
            </div>

            <div id="additionalFields" style="display: none;">
                <div class="form-divider"></div>
                <h3>추가 정보</h3>

                <div class="form-group">
                    <label for="major">목표 전공 (최대 2개)</label>
                    <select id="major" name="major">
                        <option value="">선택하세요</option>
                        <option value="물리학트랙">물리학트랙</option>
                        <option value="화학트랙">화학트랙</option>
                        <option value="생명과학트랙">생명과학트랙</option>
                        <option value="뇌과학트랙">뇌과학트랙</option>
                        <option value="기계공학트랙">기계공학트랙</option>
                        <option value="재료공학트랙">재료공학트랙</option>
                        <option value="전자공학트랙">전자공학트랙</option>
                        <option value="컴퓨터공학트랙">컴퓨터공학트랙</option>
                        <option value="화학공학트랙">화학공학트랙</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="minor">부전공/복수전공</label>
                    <select id="minor" name="minor">
                        <option value="">선택하세요</option>
                        <option value="물리학트랙">물리학트랙</option>
                        <option value="화학트랙">화학트랙</option>
                        <option value="생명과학트랙">생명과학트랙</option>
                        <option value="뇌과학트랙">뇌과학트랙</option>
                        <option value="기계공학트랙">기계공학트랙</option>
                        <option value="재료공학트랙">재료공학트랙</option>
                        <option value="전자공학트랙">전자공학트랙</option>
                        <option value="컴퓨터공학트랙">컴퓨터공학트랙</option>
                        <option value="화학공학트랙">화학공학트랙</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="currentYear">재학 학년</label>
                    <select id="currentYear" name="current_year">
                        <option value="">선택하세요</option>
                        <option value="1-1">1-1</option>
                        <option value="1-2">1-2</option>
                        <option value="2-1">2-1</option>
                        <option value="2-2">2-2</option>
                        <option value="3-1">3-1</option>
                        <option value="3-2">3-2</option>
                        <option value="4-1">4-1</option>
                        <option value="4-2">4-2</option>
                        <option value="5-1">5-1</option>
                        <option value="5-2">5-2</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="specialNotes">특이사항</label>
                    <textarea id="specialNotes" name="special_notes" rows="3"
                              placeholder="예: 초과학점 신청, 졸업학기"></textarea>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">로그인</button>
            </div>

            <div id="errorMessage" class="error-message" style="display: none;"></div>
        </form>
    </div>

    <script src="/public/js/common.js"></script>
    <script src="/public/js/login.js"></script>
</body>
</html>
